<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5EEAD4}a:hover{color:#99F6E4}
.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.num{font-variant-numeric:tabular-nums}
input[type=range]{accent-color:#2DD4BF}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; color: #E8EEF7; background: radial-gradient(circle at 85% 5%, rgba(45,212,191,0.16), transparent 40%), radial-gradient(circle at 10% 55%, rgba(99,102,241,0.18), transparent 45%), #0B1220; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 16px 16px; flex-grow: 1">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Log</h1>
<div style="font-size: 13px; color: #9AA8BC">Everything optional except what you measured</div>
</div>
<a href="Main.dc.html" aria-label="Close" class="glass" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #E8EEF7">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 16px; background: rgba(255,255,255,0.05)">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" style="min-height: 44px; border-radius: 12px; border: none; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}">{{s.name}}</button>
</sc-for>
</div>

<div class="glass" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 18px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; color: #9AA8BC; font-weight: 600">Time</span>
<span class="num" style="font-size: 22px; font-weight: 800">18:02</span>
</div>
<div style="display: flex; gap: 6px">
<button type="button" style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #E8EEF7; font: inherit; font-size: 13px; font-weight: 700">−15 min</button>
<button type="button" style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #E8EEF7; font: inherit; font-size: 13px; font-weight: 700">+15 min</button>
</div>
</div>

<section class="glass" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 22px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">Vitals</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B8C4D6">Systolic
<input class="num" type="text" inputmode="numeric" placeholder="mmHg" value="128" style="min-height: 56px; padding: 0 14px; border-radius: 14px; border: 2px solid #2DD4BF; background: rgba(11,18,32,0.7); color: #E8EEF7; font: inherit; font-size: 26px; font-weight: 800">
<span style="font-size: 12px; font-weight: 500; color: #9AA8BC">target 100–130</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B8C4D6">Diastolic
<input class="num" type="text" inputmode="numeric" placeholder="mmHg" style="min-height: 56px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.7); color: #E8EEF7; font: inherit; font-size: 26px; font-weight: 800">
<span style="font-size: 12px; font-weight: 500; color: #9AA8BC">target 60–80</span>
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B8C4D6">HR
<input class="num" type="text" inputmode="numeric" placeholder="bpm" style="min-height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.7); color: #E8EEF7; font: inherit; font-size: 22px; font-weight: 800">
<span style="font-size: 12px; font-weight: 500; color: #9AA8BC">60–90</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B8C4D6">SpO₂
<input class="num" type="text" inputmode="numeric" placeholder="%" style="min-height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.7); color: #E8EEF7; font: inherit; font-size: 22px; font-weight: 800">
<span style="font-size: 12px; font-weight: 500; color: #9AA8BC">94–100</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: #B8C4D6">Resp.
<input class="num" type="text" inputmode="numeric" placeholder="/min" style="min-height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); background: rgba(11,18,32,0.7); color: #E8EEF7; font: inherit; font-size: 22px; font-weight: 800">
<span style="font-size: 12px; font-weight: 500; color: #9AA8BC">12–20</span>
</label>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: #B8C4D6">Context</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.on}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; border: {{t.border}}">{{t.label}}</button>
</sc-for>
</div>
</div>
</section>

<section class="glass" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 22px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">Symptoms</h2>
<button type="button" onClick="{{noSymptoms}}" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #5EEAD4; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer">No symptoms</button>
</div>
<sc-for list="{{symptoms}}" as="sy" hint-placeholder-count="5">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>{{sy.name}}</span><span class="num" style="color: {{sy.valueColor}}">{{sy.display}}</span></span>
<input type="range" min="0" max="10" step="1" value="{{sy.value}}" onChange="{{sy.change}}" style="width: 100%; min-height: 32px">
<span style="font-size: 12px; color: #9AA8BC">Threshold {{sy.threshold}}</span>
</label>
</sc-for>
</section>

<section class="glass" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">Doses · Evening</h2>
<button type="button" onClick="{{allTaken}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 16px; border: none; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; background: {{allBg}}; color: {{allFg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
{{allLabel}}
</button>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: rgba(11,18,32,0.55)">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 800">Ramipril</span>
<span class="num" style="font-size: 14px; color: #B8C4D6">2.5 mg planned</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{doseStates}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="min-height: 44px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: {{d.bg}}; color: {{d.fg}}; border: {{d.border}}">{{d.label}}</button>
</sc-for>
</div>
</div>
<button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 4px; border: none; background: transparent; color: #5EEAD4; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">+ Extra dose</button>
</section>

</div>

<div style="padding: 12px 16px 20px 16px; background: rgba(11,18,32,0.85); border-top: 1px solid rgba(255,255,255,0.08)">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 18px; background: #2DD4BF; color: #04201C; font-size: 17px; font-weight: 800; text-decoration: none">Save Evening log</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      slot: 'Evening',
      tags: { Resting: true },
      sym: { 'Chest pain': null, 'Nausea': null, 'Exhaustion': 5, 'Sluggishness': null, 'Back pain': null },
      allTaken: false,
      dose: null
    };
  }
  renderVals() {
    const st = this.state;
    const slots = ['Morning', 'Noon', 'Evening', 'Night'].map((name) => ({
      name,
      bg: st.slot === name ? '#2DD4BF' : 'transparent',
      fg: st.slot === name ? '#04201C' : '#B8C4D6',
      pick: () => this.setState({ slot: name })
    }));
    const tags = ['Resting', 'After activity', 'Lying', 'Standing'].map((label) => {
      const on = !!st.tags[label];
      return {
        label, on: on ? 'true' : 'false',
        bg: on ? 'rgba(45,212,191,0.18)' : 'transparent',
        fg: on ? '#5EEAD4' : '#B8C4D6',
        border: on ? '1px solid #2DD4BF' : '1px solid rgba(255,255,255,0.16)',
        toggle: () => this.setState({ tags: { ...st.tags, [label]: !on } })
      };
    });
    const thresholds = { 'Chest pain': 2, 'Nausea': 3, 'Exhaustion': 4, 'Sluggishness': 4, 'Back pain': 3 };
    const symptoms = Object.keys(thresholds).map((name) => {
      const v = st.sym[name];
      const above = v !== null && v > thresholds[name];
      return {
        name, threshold: thresholds[name],
        value: v === null ? 0 : v,
        display: v === null ? 'not recorded' : (above ? '▲ ' + v : String(v)),
        valueColor: v === null ? '#9AA8BC' : (above ? '#FCD34D' : '#E8EEF7'),
        change: (e) => this.setState({ sym: { ...st.sym, [name]: Number(e.target.value) } })
      };
    });
    const doseStatus = st.allTaken ? 'Taken' : st.dose;
    const doseStates = ['Taken', 'Skipped', 'Changed'].map((label) => {
      const on = doseStatus === label;
      return {
        label, on: on ? 'true' : 'false',
        bg: on ? 'rgba(45,212,191,0.18)' : 'transparent',
        fg: on ? '#5EEAD4' : '#B8C4D6',
        border: on ? '1px solid #2DD4BF' : '1px solid rgba(255,255,255,0.16)',
        pick: () => this.setState({ dose: label, allTaken: false })
      };
    });
    return {
      slots, tags, symptoms, doseStates,
      noSymptoms: () => this.setState({ sym: { 'Chest pain': 0, 'Nausea': 0, 'Exhaustion': 0, 'Sluggishness': 0, 'Back pain': 0 } }),
      allTaken: () => this.setState({ allTaken: !st.allTaken, dose: null }),
      allLabel: st.allTaken ? 'All doses taken' : 'All taken as planned',
      allBg: st.allTaken ? '#4ADE80' : 'rgba(255,255,255,0.10)',
      allFg: st.allTaken ? '#052E16' : '#E8EEF7'
    };
  }
}
</script>
</body>
</html>
